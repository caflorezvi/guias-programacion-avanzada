title: Programación Avanzada
description: Guías y material de clase del espacio académico Programación Avanzada.
author: Carlos Andrés Flórez Villarraga
lang: es
repositorio: https://github.com/caflorezvi/guias-programacion-avanzada

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

exclude:
  - readme.md

defaults:
  - scope:
      path: ""
    values:
      layout: "default"
