<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Pirámide de pruebas">
  <title>Pirámide de pruebas</title>
  <desc>Pirámide con 70 % de pruebas unitarias en la base, 20 % de integración en el medio y 10 % de pruebas de extremo a extremo en la punta. Hacia arriba aumentan el costo y el tiempo de ejecución.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#888780"/></marker>
    <marker id="herencia" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12z" fill="#ffffff" stroke="#5F5E5A" stroke-width="1"/></marker>
  </defs>
  <polygon points="280,30 346.667,120 213.333,120" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5" stroke-linejoin="round"/>
  <polygon points="213.333,120 346.667,120 413.333,210 146.667,210" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5" stroke-linejoin="round"/>
  <polygon points="146.667,210 413.333,210 480,300 80,300" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5" stroke-linejoin="round"/>
  <text x="280" y="92" text-anchor="middle" fill="#791F1F" font-size="13" font-weight="600">E2E</text>
  <text x="280" y="108" text-anchor="middle" fill="#A32D2D" font-size="11">10 %</text>
  <text x="280" y="162" text-anchor="middle" fill="#0C447C" font-size="13" font-weight="600">Integración</text>
  <text x="280" y="178" text-anchor="middle" fill="#185FA5" font-size="11">20 %</text>
  <text x="280" y="252" text-anchor="middle" fill="#04342C" font-size="13" font-weight="600">Unitarias</text>
  <text x="280" y="268" text-anchor="middle" fill="#0F6E56" font-size="11">70 %</text>
  <line x1="333.333" y1="86" x2="500" y2="86" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="508" y="84" text-anchor="start" fill="#791F1F" font-size="12" font-weight="500">Sistema completo</text>
  <text x="508" y="99" text-anchor="start" fill="#5F5E5A" font-size="11">Selenium, Cypress</text>
  <line x1="396.667" y1="161" x2="500" y2="161" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="508" y="159" text-anchor="start" fill="#0C447C" font-size="12" font-weight="500">Componentes colaborando</text>
  <text x="508" y="174" text-anchor="start" fill="#5F5E5A" font-size="11">SpringBootTest</text>
  <line x1="463.333" y1="251" x2="500" y2="251" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="508" y="249" text-anchor="start" fill="#04342C" font-size="12" font-weight="500">Lógica aislada</text>
  <text x="508" y="264" text-anchor="start" fill="#5F5E5A" font-size="11">JUnit, Mockito</text>
  <path d="M40 300 L40 34" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="28" y="167" text-anchor="middle" fill="#5F5E5A" font-size="11" transform="rotate(-90 28 167)">más lentas y costosas</text>
</svg>
