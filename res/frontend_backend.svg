<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Frontend y backend">
  <title>Frontend y backend</title>
  <desc>El frontend es el cliente (navegador o aplicación). El backend agrupa el servidor web, el servidor de aplicaciones y la base de datos. Entre cada par fluyen peticiones y respuestas.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#888780"/></marker>
    <marker id="herencia" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12z" fill="#ffffff" stroke="#5F5E5A" stroke-width="1"/></marker>
  </defs>
  <path d="M182 20 V100 M182 184 V230" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="90" y="50" text-anchor="middle" fill="#2C2C2A" font-size="15" font-weight="600">Frontend</text>
  <text x="437" y="50" text-anchor="middle" fill="#2C2C2A" font-size="15" font-weight="600">Backend</text>
  <rect x="20" y="110" width="130" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="85" y="138.5" text-anchor="middle" fill="#0C447C" font-size="13" font-weight="500">Cliente</text>
  <text x="85" y="153.5" text-anchor="middle" fill="#185FA5" font-size="11">navegador o app</text>
  <rect x="215" y="110" width="120" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="275" y="138.5" text-anchor="middle" fill="#04342C" font-size="13" font-weight="500">Servidor web</text>
  <text x="275" y="153.5" text-anchor="middle" fill="#0F6E56" font-size="11">archivos estáticos</text>
  <rect x="380" y="110" width="125" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="442.5" y="138.5" text-anchor="middle" fill="#04342C" font-size="13" font-weight="500">Servidor de</text>
  <text x="442.5" y="153.5" text-anchor="middle" fill="#0F6E56" font-size="11">aplicaciones · API</text>
  <path d="M550 110 A55 10 0 0 0 660 110 V174 A55 10 0 0 1 550 174 Z" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <ellipse cx="605" cy="110" rx="55" ry="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="605" y="143.5" text-anchor="middle" fill="#412402" font-size="13" font-weight="500">Base de datos</text>
  <text x="605" y="158.5" text-anchor="middle" fill="#854F0B" font-size="11">persistencia</text>
  <path d="M152 132 L213 132" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M213 152 L152 152" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M337 132 L378 132" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M378 152 L337 152" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M507 132 L548 132" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M548 152 L507 152" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="182" y="124" text-anchor="middle" fill="#5F5E5A" font-size="10">petición</text>
  <text x="182" y="168" text-anchor="middle" fill="#5F5E5A" font-size="10">respuesta</text>
</svg>
