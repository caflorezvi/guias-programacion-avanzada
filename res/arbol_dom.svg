<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 375" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Árbol DOM">
  <title>Árbol DOM</title>
  <desc>Representación del DOM: el nodo document contiene el elemento raíz html, que tiene como hijos head y body. head contiene title con su texto; body contiene un enlace a con atributo href y texto, y un encabezado h1 con texto.</desc>
