  <text x="150" y="200" text-anchor="middle" fill="#0C447C" font-size="12" font-weight="600" font-family="Menlo, Consolas, monospace">&lt;head&gt;</text>
  <rect x="450" y="167" width="120" height="42" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="510" y="184" text-anchor="middle" fill="#185FA5" font-size="10">Elemento</text>
  <text x="510" y="200" text-anchor="middle" fill="#0C447C" font-size="12" font-weight="600" font-family="Menlo, Consolas, monospace">&lt;body&gt;</text>
