  <text x="290" y="259" text-anchor="middle" fill="#854F0B" font-size="10">Atributo</text>
  <text x="290" y="275" text-anchor="middle" fill="#412402" font-size="12" font-weight="600" font-family="Menlo, Consolas, monospace">href</text>
  <rect x="370" y="242" width="120" height="42" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="430" y="259" text-anchor="middle" fill="#185FA5" font-size="10">Elemento</text>
