<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Componentes en Spring Boot">
  <title>Componentes en Spring Boot</title>
  <desc>Diagrama de clases: Controller, Service y Repository son especializaciones de Component.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#888780"/></marker>
    <marker id="herencia" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12z" fill="#ffffff" stroke="#5F5E5A" stroke-width="1"/></marker>
  </defs>
  <rect x="250" y="30" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="54.5" text-anchor="middle" fill="#2C2C2A" font-size="13" font-weight="500">Component</text>
  <text x="340" y="69.5" text-anchor="middle" fill="#5F5E5A" font-size="11" font-family="Menlo, Consolas, monospace">@Component</text>
  <rect x="40" y="170" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="130" y="194.5" text-anchor="middle" fill="#0C447C" font-size="13" font-weight="500">Controller</text>
  <text x="130" y="209.5" text-anchor="middle" fill="#185FA5" font-size="11" font-family="Menlo, Consolas, monospace">@RestController</text>
  <path d="M130 168 L130 130" fill="none" stroke="#5F5E5A" stroke-width="1"/>
  <rect x="250" y="170" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="194.5" text-anchor="middle" fill="#04342C" font-size="13" font-weight="500">Service</text>
  <text x="340" y="209.5" text-anchor="middle" fill="#0F6E56" font-size="11" font-family="Menlo, Consolas, monospace">@Service</text>
  <path d="M340 168 L340 130" fill="none" stroke="#5F5E5A" stroke-width="1"/>
  <rect x="460" y="170" width="180" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="550" y="194.5" text-anchor="middle" fill="#412402" font-size="13" font-weight="500">Repository</text>
  <text x="550" y="209.5" text-anchor="middle" fill="#854F0B" font-size="11" font-family="Menlo, Consolas, monospace">@Repository</text>
  <path d="M550 168 L550 130" fill="none" stroke="#5F5E5A" stroke-width="1"/>
  <path d="M130 130 L550 130" fill="none" stroke="#5F5E5A" stroke-width="1"/>
  <path d="M340 130 L340 88" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#herencia)"/>
</svg>
