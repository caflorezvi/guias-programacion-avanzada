<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Flujo de autenticación en Spring Security">
  <title>Flujo de autenticación en Spring Security</title>
  <desc>El filtro UsernamePasswordAuthenticationFilter extrae las credenciales de la petición, el AuthenticationManager las valida con un AuthenticationProvider; si la autenticación es exitosa se crea el objeto Authentication, si no, se lanza un error.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#888780"/></marker>
    <marker id="herencia" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12z" fill="#ffffff" stroke="#5F5E5A" stroke-width="1"/></marker>
  </defs>
  <rect x="90" y="30" width="260" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="220" y="56" text-anchor="middle" fill="#0C447C" font-size="13" font-weight="500">UsernamePasswordAuthenticationFilter</text>
  <rect x="490" y="30" width="170" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="575" y="56" text-anchor="middle" fill="#2C2C2A" font-size="13" font-weight="500">HttpServletRequest</text>
  <path d="M352 52 L488 52" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="420" y="70" text-anchor="middle" fill="#444441" font-size="11">Extrae las credenciales</text>
  <text x="420" y="83" text-anchor="middle" fill="#444441" font-size="11">de la petición HTTP</text>
  <rect x="90" y="130" width="260" height="44" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="220" y="156" text-anchor="middle" fill="#173404" font-size="13" font-weight="500">AuthenticationManager</text>
  <rect x="90" y="230" width="260" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="220" y="256" text-anchor="middle" fill="#04342C" font-size="13" font-weight="500">AuthenticationProvider</text>
  <path d="M220 76 L220 128" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="232" y="98" text-anchor="start" fill="#444441" font-size="11">Valida las credenciales con</text>
  <text x="232" y="111" text-anchor="start" fill="#444441" font-size="11">el gestor de autenticación</text>
  <path d="M220 176 L220 228" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="232" y="198" text-anchor="start" fill="#444441" font-size="11">Obtiene las credenciales del</text>
  <text x="232" y="211" text-anchor="start" fill="#444441" font-size="11">proveedor de autenticación</text>
  <path d="M220 276 L220 318" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polygon points="220,320 310,370 220,420 130,370" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5" stroke-linejoin="round"/>
  <text x="220" y="366" text-anchor="middle" fill="#0C447C" font-size="12" font-weight="500">¿Autenticación</text>
  <text x="220" y="381" text-anchor="middle" fill="#0C447C" font-size="12" font-weight="500">exitosa?</text>
  <path d="M310 370 L488 370" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="362" text-anchor="middle" fill="#A32D2D" font-size="12" font-weight="600">No</text>
  <rect x="490" y="348" width="170" height="44" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="575" y="366.5" text-anchor="middle" fill="#791F1F" font-size="13" font-weight="500">Lanzar error</text>
  <text x="575" y="381.5" text-anchor="middle" fill="#A32D2D" font-size="11">AuthenticationException</text>
  <path d="M220 420 L220 488" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="232" y="458" text-anchor="start" fill="#0F6E56" font-size="12" font-weight="600">Sí</text>
  <rect x="90" y="490" width="260" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="220" y="516" text-anchor="middle" fill="#3C3489" font-size="13" font-weight="500">Crear objeto Authentication</text>
</svg>
