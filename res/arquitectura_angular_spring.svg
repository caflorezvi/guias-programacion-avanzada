  <path d="M330 306 L330 186" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="162" y="250" text-anchor="start" fill="#444441" font-size="11">petición HTTP</text>
  <text x="342" y="250" text-anchor="start" fill="#444441" font-size="11">respuesta JSON</text>
