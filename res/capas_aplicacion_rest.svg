<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 780" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Arquitectura de una aplicación REST">
  <title>Arquitectura de una aplicación REST</title>
  <desc>Capas de una aplicación REST en Spring Boot. Por cada recurso (usuarios, alojamientos, reseñas) hay un controlador, un servicio, un repositorio y una entidad; todos comparten la aplicación cliente y la base de datos.</desc>
